# Local Helm overrides for the sandbox. Copy to values-local.yaml (gitignored)
# next to this file. recover-after-restart.sh flattens it into `--set` flags
# for `ma sandbox sync`, so the overrides land in sync's own helm call and
# outrank values-k3d.yaml (which pins every app image tag to "main").
#
# Use this instead of `kubectl set image`, which takes field ownership away
# from Helm and breaks the next sync (CLAUDE.md gotcha #12). Images must
# already exist in k3d — the script re-imports any local image whose name
# matches LOCAL_IMAGE_PATTERN (default "-local") before syncing.
#
# Nested mappings only (no lists). Keep tags non-numeric: `--set` types a
# bare number like 20261014 as an integer.
images:
  controllermgr:
    repository: michelangelo-controllermgr-local
    tag: tritonfix
